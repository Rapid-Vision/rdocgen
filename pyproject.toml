[project]
name = "rdocgen"
version = "0.1.0"
description = "Markdown documentation generator from python source code"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikhail Pankin", email = "mishapankin@gmail.com" }]
keywords = ["docgen", "docs", "documentation"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://rapid-vision.github.io/rdocgen"
Repository = "https://github.com/Rapid-Vision/rdocgen"
Issues = "https://github.com/Rapid-Vision/rdocgen/issues"

[project.scripts]
rdocgen = "rdocgen:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.19.1", "pytest>=9.0.2", "ruff>=0.14.14"]
